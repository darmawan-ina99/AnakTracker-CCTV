plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anak.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.anak.tracker"
        minSdk 24
        targetSdk 28
        versionCode 22
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
